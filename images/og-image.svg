<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Page background: the app's own dark purple ramp (#0d0614 / #1a0b2e). -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0614" />
      <stop offset="50%" stop-color="#1a0b2e" />
      <stop offset="100%" stop-color="#090512" />
    </linearGradient>

    <!-- Brand accent ramp, matching favicon.svg's badge gradient. -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="200" r="450" fill="url(#purpleGlow)" />

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <rect x="80" y="60" width="1040" height="510" rx="32" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Brand mark: the PIVX shield with the DNS-node overlay, identical geometry to
       favicon.svg so the icon set and the social card cannot drift apart.
       favicon.svg is a 500x500 canvas; 0.24 scales it to a 120px badge. -->
  <g transform="translate(140, 135) scale(0.24)">
    <rect width="500" height="500" rx="110" ry="110" fill="url(#brandGrad)" />
    <g transform="translate(60, 60) scale(0.76)">
      <path fill="#ffffff" d="M408 67.5c0-5.9-4.3-10.9-10.1-11.8L221.8 27.5c-.6-.1-1.3-.2-1.9-.2h-.1c-.5 0-1.6.1-1.8.1L58.7 52.9l-17.1 2.7c-5.8.9-10.1 5.9-10.1 11.8v257.1c0 60.2 126.2 124 183.8 147.3 1.1.4 2.2.7 3.3.8.4 0 .8.1 1.1.1 1.5 0 3-.3 4.4-.9 32.9-13.2 88-39.6 129.2-71 3.2-2.5 6.6-5 9.6-7.5 11.6-9.5 21.7-19.4 29.4-29.5 2.3-3.1 6.6-9.8 7.7-11.7 2-3.6 3.6-7.2 4.9-10.8 1.9-5.4 2.9-10.9 2.9-16.4V67.5h.2zM393.6 319c0 1.3-.1 2.5-.2 3.8-.4 3.8-1.2 7.6-2.5 11.3-1.2 3.4-2.7 6.7-4.5 10-1 1.8-5 8-7.1 10.8-7.1 9.3-16.4 18.5-27.2 27.3-2.7 2.3-5.9 4.6-8.9 7-38 29-89 53.4-119.3 65.6-1.3.5-2.7.8-4.1.8-1.4 0-2.8-.3-4.1-.8C162.5 433.3 46 374.5 46 318.8V81.4c0-5.4 3.9-10 9.3-10.9L71 68l147.1-23.5c.6-.1 1.2-.1 1.7-.1.6 0 1.2 0 1.7.1L374.8 69l9.5 1.5c2.7.4 5 1.8 6.7 3.7.4.5.8 1 1.1 1.6.6 1.1 1.1 2.3 1.3 3.6.1.6.2 1.3.2 2V319z" />
      <path fill="#ffffff" d="M232.8 199.2c6.8 0 12.3-5.5 12.3-12.3s-5.5-12.3-12.3-12.3h-95c-1 0-1.7.8-1.7 1.7v10.6c0 6.6 5.2 12 11.7 12.4l85-.1z" />
      <path fill="#ffffff" d="M256.2 102.7H155.6c-1 0-1.7.8-1.7 1.7V115c0 6.6 5.2 12 11.7 12.4l85.5-.2c3.2 0 6.1.1 6.1.1 31.5 1.5 56.6 27.7 56.6 59.6 0 32.2-25.6 58.3-57.5 59.3h-90c-.6 0-1.2 0-1.8.1-5.6.8-10 5.5-10.4 11.3v121.5c0 1 .8 1.7 1.7 1.7h10.6c6.6 0 12-5.2 12.4-11.7v-96.7c0-.8.8-1.5 1.6-1.5l77.7-.1c6.7-.3 13.2-1.4 19.4-3.1 35.3-10.1 61.1-42.4 61.1-80.9-.2-45.8-36.8-83-82.4-84.1z" />
      <g transform="translate(320, 320)">
        <circle cx="90" cy="90" r="100" fill="#a855f7" stroke="#6b21a8" stroke-width="20" />
        <circle cx="50" cy="90" r="20" fill="#ffffff" />
        <circle cx="130" cy="60" r="20" fill="#ffffff" />
        <circle cx="110" cy="130" r="20" fill="#ffffff" />
        <line x1="50" y1="90" x2="130" y2="60" stroke="#ffffff" stroke-width="12" />
        <line x1="50" y1="90" x2="110" y2="130" stroke="#ffffff" stroke-width="12" />
        <line x1="130" y1="60" x2="110" y2="130" stroke="#ffffff" stroke-width="12" />
      </g>
    </g>
  </g>

  <text x="290" y="205" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-1">PIVX Name</text>
  <text x="292" y="255" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#d8b4fe">Decentralized Domain Name Service for PIVX</text>

  <text x="140" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#d1d5db">
    Register readable domain names for PIVX Sapling shielded addresses.
  </text>
  <text x="140" y="400" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#9ca3af">
    Fast, private, secure name resolution and domain marketplace on PIVX.
  </text>

  <!-- All four registrable zones, matching pins-core's ALLOWED_ZONES. -->
  <g transform="translate(140, 460)">
    <rect x="0" y="0" width="118" height="46" rx="23" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="59" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#d8b4fe" text-anchor="middle">.pivx</text>

    <rect x="134" y="0" width="150" height="46" rx="23" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="209" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#d8b4fe" text-anchor="middle">.private</text>

    <rect x="300" y="0" width="146" height="46" rx="23" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="373" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#d8b4fe" text-anchor="middle">.secure</text>

    <rect x="462" y="0" width="118" height="46" rx="23" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="521" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#d8b4fe" text-anchor="middle">.safe</text>
  </g>

  <text x="1040" y="492" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="26" fill="#ffffff" text-anchor="end" opacity="0.9">pivx.name</text>
</svg>
